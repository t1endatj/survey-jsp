<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="rtic-logo.png" alt="RTIC Logo" class="logo">
            <h1>Survey</h1>
            <p class="subtitle">If you have a moment, we'd appreciate it if you would fill out this survey.</p>
        </div>

        <form action="surveyListServlet" method="post">
            <input type="hidden" name="action" value="add">
            
            <h2>Your information:</h2>
            <div class="form-group">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" name="firstName" required>
            </div>
            
            <div class="form-group">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" name="lastName" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="dateOfBirth">Date of Birth</label>
                <input type="date" id="dateOfBirth" name="dateOfBirth" required>
            </div>
            
            <h2>How did you hear about us?</h2>
            <div class="radio-group">
                <label class="radio-label">
                    <input type="radio" id="search" name="source" value="search" checked> Search engine
                </label>
                <label class="radio-label">
                    <input type="radio" id="word" name="source" value="word"> Word of mouth
                </label>
                <label class="radio-label">
                    <input type="radio" id="social" name="source" value="social"> Social Media
                </label>
                <label class="radio-label">
                    <input type="radio" id="other" name="source" value="other"> Other
                </label>
            </div>
            
            <h2>Would you like to receive announcements about new CDs and special offers?</h2>
            <div class="checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" name="announcements" value="yes"> YES, I'd like that.
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" name="emailAnnouncements" value="yes"> Yes, please send me email announcements
                </label>
            </div>
            
            <div class="contact-group">
                <label for="contact">Please contact me by:</label>
                <select name="contact" id="contact">
                    <option value="post">Email or postal mail</option>
                    <option value="email">Email</option>
                    <option value="postal">Postal mail</option>
                </select>
            </div>
           
            <div class="form-actions">
                <input type="submit" value="Join Now" id="submit">
            </div>
        </form>
    </div>
</body>
</html>
